name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Import signing certificate
        env:
          SIGNING_CERT_P12: ${{ secrets.SIGNING_CERT_P12 }}
          SIGNING_CERT_P12_PASSWORD: ${{ secrets.SIGNING_CERT_P12_PASSWORD }}
        run: |
          # "Developer ID Application: Pablo Pusiol" identity (p12 includes
          # Apple's Developer ID intermediate for a complete chain)
          KC="$RUNNER_TEMP/ci.keychain-db"
          security create-keychain -p ci "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p ci "$KC"
          printf '%s' "$SIGNING_CERT_P12" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" \
            -P "$SIGNING_CERT_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KC" >/dev/null
          security list-keychains -d user -s "$KC" login.keychain-db
          security find-identity -v -p codesigning "$KC"

      - name: Build
        run: |
          xcodebuild -project blussh.xcodeproj -scheme blussh \
            -configuration Release build -quiet \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            DEVELOPMENT_TEAM=VMGQ6AAMB5 \
            ENABLE_HARDENED_RUNTIME=YES \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO \
            OTHER_CODE_SIGN_FLAGS="--timestamp"
          BUILT=$(xcodebuild -project blussh.xcodeproj -scheme blussh \
            -configuration Release -showBuildSettings 2>/dev/null \
            | awk '/ BUILT_PRODUCTS_DIR/{print $3}')
          codesign -d -r- "${BUILT}/blussh.app"
          ditto -c -k --keepParent "${BUILT}/blussh.app" "blussh-${GITHUB_REF_NAME}.zip"

      - name: Notarize and staple
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          printf '%s' "$ASC_API_KEY_P8" > "$RUNNER_TEMP/asc.p8"
          # submit --wait exits 0 even when the verdict is Invalid; check the
          # status ourselves and surface Apple's log instead of letting
          # stapler fail later with a cryptic "Record not found"
          RESULT=$(xcrun notarytool submit "blussh-${GITHUB_REF_NAME}.zip" \
            --key "$RUNNER_TEMP/asc.p8" --key-id "$ASC_KEY_ID" \
            --issuer "$ASC_ISSUER_ID" --wait --output-format json)
          echo "$RESULT"
          SUBMISSION_ID=$(echo "$RESULT" | jq -r .id)
          if [ "$(echo "$RESULT" | jq -r .status)" != "Accepted" ]; then
            xcrun notarytool log "$SUBMISSION_ID" \
              --key "$RUNNER_TEMP/asc.p8" --key-id "$ASC_KEY_ID" \
              --issuer "$ASC_ISSUER_ID"
            exit 1
          fi
          BUILT=$(xcodebuild -project blussh.xcodeproj -scheme blussh \
            -configuration Release -showBuildSettings 2>/dev/null \
            | awk '/ BUILT_PRODUCTS_DIR/{print $3}')
          xcrun stapler staple "${BUILT}/blussh.app"
          # Re-zip so the published artifact carries the stapled ticket
          ditto -c -k --keepParent "${BUILT}/blussh.app" "blussh-${GITHUB_REF_NAME}.zip"
          spctl -a -t exec -vv "${BUILT}/blussh.app"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "blussh-${GITHUB_REF_NAME}.zip" \
            --title "$GITHUB_REF_NAME" --generate-notes

      - name: Update Homebrew tap
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          SHA256=$(shasum -a 256 "blussh-${GITHUB_REF_NAME}.zip" | awk '{print $1}')

          KEY_FILE=$(mktemp)
          printf '%s\n' "$TAP_DEPLOY_KEY" > "$KEY_FILE"
          export GIT_SSH_COMMAND="ssh -i $KEY_FILE -o StrictHostKeyChecking=accept-new"

          git clone --depth 1 git@github.com:blusa/homebrew-tap.git tap
          mkdir -p tap/Casks
          scripts/make-cask.sh "$VERSION" "$SHA256" > tap/Casks/blussh.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/blussh.rb
          git commit -m "blussh ${VERSION}"
          git push
